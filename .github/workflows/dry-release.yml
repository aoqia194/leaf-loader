name: Dry Release

on:
  workflow_dispatch:

permissions:
  actions: write
  id-token: write
  contents: write

jobs:
  dry-release:
    name: Dry Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: temurin
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-home-cache-excludes: 'caches/leaf-loom' # Causes a massive stall for CI builds.

      - name: Build
        run: ./gradlew build -x test -S -Pleaf.loom.onlyProvideJars=true

      - name: Deploy
        run: ./gradlew publish -S -Pleaf.loom.onlyProvideJars=true

      - name: Dry Release
        env:
          JRELEASER_DRY_RUN: true
          JRELEASER_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_PUBLIC_KEY: ${{ secrets.GPG_PUBLIC_KEY }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE_KEY: ${{ secrets.GPG_PASSPHRASE_KEY }}
          MAVEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
        run: ./gradlew jreleaserFullRelease -S -Pleaf.loom.onlyProvideJars=true
