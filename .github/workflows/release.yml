name: Release

on: workflow_dispatch

jobs:
  release:
    if: ${{ github.repository_owner == 'aoqia194' }}
    name: Release
    runs-on: ubuntu-latest
    environment: publishing

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: temurin
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-home-cache-excludes: 'caches/leaf-loom' # Causes a massive stall for CI builds.

      - name: Build
        run: ./gradlew build -x test -S -Pleaf.loom.minimalSetup

      - name: Release
        env:
          JRELEASER_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_PUBLIC_KEY: ${{ secrets.GPG_PUBLIC_KEY }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE_KEY: ${{ secrets.GPG_PASSPHRASE_KEY }}
          MAVEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
        run: ./gradlew checkVersion generateInstallerJson publish jreleaserFullRelease -S -Pleaf.loom.minimalSetup

      # Taken from installerjson.yml

      - name: Get Loader Version
        run: echo "LOADER_VERSION=$(./gradlew -q getLoaderVersion -Pleaf.loom.minimalSetup | grep -Eo '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\.(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\+([0-9a-zA-Z-]+(?:\.[0-9a-zA-Z-]+)*))?$')" >> $GITHUB_ENV

      - name: Upload Installer Json to Leaf
        uses: supsm/copy_file_to_another_repo@master
        env:
          API_TOKEN_GITHUB: ${{ secrets.API_TOKEN_GITHUB }}
        with:
          source_file: 'src/main/resources/leaf-installer.json'
          destination_repo: 'aoqia194/leaf'
          destination_folder: "dist/loader/${{ env.LOADER_VERSION }}.json"
          user_email: 'aoqia@aoqia.dev'
          user_name: 'aoqia194'
