name: Release

on:
  workflow_dispatch:
    inputs:
      is_snapshot:
        type: boolean
        description: "Publish as a snapshot?"
        default: true
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    environment: publishing
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: temurin
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # If this isn't a snapshot release, publish a snapshot release so that they are both up-to-date.
      - name: Sync Snapshot
        if: ${{ !github.event.inputs.is_snapshot }}
        run: ./gradlew checkVersion copyJson publish -S -Pleaf.loom.minimalSetup=true
        env:
          ORG_GRADLE_PROJECT_signingKey: ${{ secrets.GPG_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.GPG_PASSPHRASE_KEY }}
          ORG_GRADLE_PROJECT_mavenUsername: ${{ secrets.MAVEN_USERNAME }}
          ORG_GRADLE_PROJECT_mavenPassword: ${{ secrets.MAVEN_PASSWORD }}
          ORG_GRADLE_PROJECT_isSnapshot: true

      - name: Release
        run: ./gradlew checkVersion copyJson publish -S -Pleaf.loom.minimalSetup=true
        env:
          ORG_GRADLE_PROJECT_signingKey: ${{ secrets.GPG_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.GPG_PASSPHRASE_KEY }}
          ORG_GRADLE_PROJECT_mavenUsername: ${{ secrets.MAVEN_USERNAME }}
          ORG_GRADLE_PROJECT_mavenPassword: ${{ secrets.MAVEN_PASSWORD }}
          ORG_GRADLE_PROJECT_isSnapshot: ${{ github.event.inputs.is_snapshot || false }}

      - name: Generate Changelog
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        id: cliff
        uses: orhun/git-cliff-action@v4
        with:
          config: ".cliff.toml"
          args: --latest -v
        env:
          GITHUB_REPO: ${{ github.repository }}

      - name: Create GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          body: ${{ steps.cliff.outputs.content }}


      # Taken from installerjson.yml

      - name: Get Loader Version
        if: ${{ !github.event.inputs.is_snapshot }}
        run: echo "LOADER_VERSION=$(./gradlew -q getLoaderVersion -Pleaf.loom.minimalSetup=true | grep -Eo '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\.(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\+([0-9a-zA-Z-]+(?:\.[0-9a-zA-Z-]+)*))?$')" >> $GITHUB_ENV

      - name: Upload Installer Json to Leaf
        if: ${{ !github.event.inputs.is_snapshot }}
        uses: supsm/copy_file_to_another_repo@master
        env:
          API_TOKEN_GITHUB: ${{ secrets.API_TOKEN_GITHUB }}
        with:
          source_file: 'src/main/resources/leaf-installer.json'
          destination_repo: 'aoqia194/leaf'
          destination_folder: "dist/loader/${{ env.LOADER_VERSION }}.json"
          user_email: 'aoqia@aoqia.dev'
          user_name: 'aoqia194'
